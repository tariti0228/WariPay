version: '3.8'

services:
  app:
    container_name: wari-pay-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    tty: true
    stdin_open: true
    command: npx expo start --tunnel 